name: Create signing key (run ONCE)

on:
  workflow_dispatch:

jobs:
  create-key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate keystore
        run: |
          set -e
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -storetype PKCS12 -keystore daftar.jks -alias daftar \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Daftar, O=Daftar, C=DZ"
          base64 -w0 daftar.jks > keystore.b64
          {
            echo "KEYSTORE_PASSWORD=$PASS"
            echo "KEY_ALIAS=daftar"
            echo "KEY_PASSWORD=$PASS"
            echo "KEYSTORE_BASE64 = full content of keystore.b64"
          } > secrets.txt
          mkdir -p keyout && mv daftar.jks keystore.b64 secrets.txt keyout/
      - uses: actions/upload-artifact@v4
        with:
          name: daftar-signing-key-KEEP-PRIVATE
          path: keyout/
          retention-days: 1
